# EXCLUSLAWYER 服务编排
# ---------------------------------------------------------------
# 最小启动（开发推荐，向量库用 Milvus Lite 本地文件，无 GPU 可跑）:
#   docker compose up --build
# 完整启动（Milvus Standalone + Neo4j + Celery Worker）:
#   docker compose --profile full up --build
# ---------------------------------------------------------------
name: excluslawyer

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    ports:
      - "8000:8000"
    environment:
      EMBEDDER: ${EMBEDDER:-bge_m3}          # bge_m3 | hash
      VECTOR_STORE: ${VECTOR_STORE:-milvus_lite}  # milvus_lite | milvus | numpy
      MILVUS_URI: ${MILVUS_URI:-/app/data/milvus_lite.db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      AUTO_INGEST: ${AUTO_INGEST:-true}       # 首次启动自动灌入种子法条
    volumes:
      - ./backend/data:/app/data
      - model-cache:/root/.cache             # BGE-M3 模型缓存，避免重复下载
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      - backend

  # ---------------- 以下服务属于 profile: full ----------------
  etcd:
    profiles: ["full"]
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    profiles: ["full"]
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    profiles: ["full"]
    image: milvusdb/milvus:v2.4.4
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  neo4j:
    profiles: ["full"]
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/excluslawyer
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

  worker:
    profiles: ["full"]
    build:
      context: ./backend
      args:
        INSTALL_ML: "true"
    environment:
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
    volumes:
      - ./backend/data:/app/data
      - model-cache:/root/.cache
    depends_on:
      - redis
      - milvus
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

volumes:
  model-cache:
  etcd-data:
  minio-data:
  milvus-data:
  neo4j-data:
